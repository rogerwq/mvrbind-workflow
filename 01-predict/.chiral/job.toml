name = "Predict Binding Sites"
description = "Runs MVRBind to predict per-nucleotide RNA-small molecule binding sites"
inputs = ["pdb/*", "fasta/*", "aligned/*", "em/*", "asa/*", "pt/*"]
outputs = ["predictions.txt"]

[container]
image = "ghcr.io/chiral-data/mvrbind:2026_05_14"

[scripts]
run = "run.sh"
